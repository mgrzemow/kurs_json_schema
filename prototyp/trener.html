[hidden] { display: none !important; }
html, body { height: 100%; }
html.duze { font-size: 118%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-sans); font-variation-settings: "CASL" 0, "MONO" 0;
  font-size: 0.95rem; line-height: 1.5;
}
code, pre, .CodeMirror { font-family: var(--f-mono); font-variation-settings: "MONO" 1, "CASL" 0; }
code { font-size: 0.92em; background: var(--accent-soft); color: var(--ink); padding: 0.05em 0.35em; border-radius: 4px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, .marka { font-variation-settings: "CASL" 1, "MONO" 0; text-wrap: balance; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: 236px minmax(0, 1.12fr) minmax(0, 1fr);
}

/* ——— Lista ćwiczeń ——— */
.nav {
  background: var(--panel); border-right: 1px solid var(--line);
  overflow: auto; padding: 20px 14px; display: flex; flex-direction: column; gap: 18px;
}
.marka { display: flex; align-items: center; gap: 10px; padding-inline: 6px; }
.marka-znak {
  width: 34px; height: 34px; border-radius: 8px; flex: none;
  display: grid; place-items: center; background: var(--accent); color: var(--accent-ink);
  font-family: var(--f-mono); font-variation-settings: "MONO" 1; font-weight: 800; font-size: 0.95rem;
}
.marka-tekst { line-height: 1.15; }
.marka-tekst strong { display: block; font-weight: 820; font-size: 1.02rem; }
.marka-tekst span { font-size: 0.78rem; color: var(--muted); }

.lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.lista button {
  width: 100%; display: grid; grid-template-columns: 26px 1fr 18px; align-items: center; gap: 8px;
  text-align: left; background: none; border: 0; border-radius: 8px; padding: 8px 8px; color: var(--ink);
}
.lista button:hover { background: var(--sunk); }
.lista button[aria-current="true"] { background: var(--accent-soft); }
.lista .nr {
  font-family: var(--f-mono); font-variation-settings: "MONO" 1; font-size: 0.78rem; color: var(--muted);
  font-variant-numeric: tabular-nums; text-align: center;
}
.lista button[aria-current="true"] .nr { color: var(--accent); font-weight: 700; }
.lista .tytul { font-size: 0.9rem; line-height: 1.25; min-width: 0; }
.lista .zrobione { color: var(--ok); display: grid; place-items: center; }
.lista .oddziel { height: 1px; background: var(--line); margin: 8px 6px; }

.nav-stopka { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-inline: 6px; }
.nav-stopka p { margin: 0; font-size: 0.78rem; color: var(--muted); }
.przelacznik {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 0.85rem;
}
.przelacznik .stan { font-size: 0.75rem; color: var(--muted); }
.przelacznik[aria-pressed="true"] { border-color: var(--accent); }
.przelacznik[aria-pressed="true"] .stan { color: var(--accent); font-weight: 700; }
.link-btn { background: none; border: 0; padding: 0; font-size: 0.78rem; color: var(--muted); text-decoration: underline; text-align: left; }
.link-btn.uwaga { color: var(--bad); }

/* ——— Środek: zadanie + edytor ——— */
.srodek { min-height: 0; overflow: auto; padding: 24px 28px; display: flex; flex-direction: column; gap: 18px; }
.zadanie { display: flex; flex-direction: column; gap: 10px; max-width: 68ch; }
.eyebrow { margin: 0; font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.zadanie h1 { margin: 0; font-size: 1.75rem; line-height: 1.15; font-weight: 820; }
.zadanie p { margin: 0; }
.kontekst { color: var(--muted); }
.polecenie strong { font-weight: 750; }
.slowa { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.82rem; color: var(--muted); }
.pomoc { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: 0.86rem;
}
.btn:hover { border-color: var(--accent); }
.btn[aria-expanded="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn-main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn-main:hover { filter: brightness(1.08); }
.pomoc-tresc {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px;
  display: flex; flex-direction: column; gap: 10px;
}
.pomoc-tresc p { margin: 0; }
.pomoc-tresc pre {
  margin: 0; background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  overflow-x: auto; font-size: 0.85rem; line-height: 1.5;
}
.pomoc-akcje { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.pomoc-akcje small { color: var(--muted); }

.edytor { display: flex; flex-direction: column; gap: 8px; flex: 1 1 auto; min-height: 0; }
.edytor-pasek { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.edytor-pasek h2 { margin: 0; font-size: 0.95rem; font-weight: 750; }
.ramka {
  position: relative; flex: 1 1 auto; min-height: 300px;
  border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); overflow: hidden;
}
.ramka .CodeMirror { position: absolute; inset: 0; height: 100%; }
.diagnoza { display: flex; flex-direction: column; gap: 6px; }
.diag {
  display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start;
  font-size: 0.86rem; border-radius: 8px; padding: 8px 10px; background: var(--sunk); border: 1px solid var(--line);
}
.diag .znak { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 0.75rem; margin-top: 1px; }
.diag p { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.diag .etykieta { font-weight: 750; }
.diag.blad { background: var(--bad-soft); border-color: transparent; }
.diag.blad .znak { background: var(--bad); color: var(--panel); }
.diag.ostrz { background: var(--warn-soft); border-color: transparent; }
.diag.ostrz .znak { background: var(--warn); color: var(--panel); }
.diag.info .znak { background: var(--muted); color: var(--panel); }
.diag.dobrze { background: none; border-color: transparent; padding-block: 2px; color: var(--muted); }
.diag.dobrze .znak { background: var(--ok); color: var(--panel); }
.do-linii {
  background: none; border: 1px solid currentColor; border-radius: 6px; padding: 1px 7px; font-size: 0.75rem;
  white-space: nowrap; color: var(--muted);
}

/* ——— Prawa kolumna: przykłady ——— */
.prawa { overflow: auto; padding: 24px 24px; background: var(--sunk); border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px; }
#panel-przyklady { display: flex; flex-direction: column; gap: 18px; }
.podsum { display: flex; flex-direction: column; gap: 10px; }
.podsum-wiersz { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.podsum h2 { margin: 0; font-size: 1.05rem; font-weight: 800; }
.licznik { font-size: 0.88rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.licznik strong { color: var(--ink); font-size: 1rem; }
.pasek { display: flex; gap: 3px; height: 8px; }
.pasek span { flex: 1; border-radius: 3px; background: var(--line); transition: background-color .25s; }
.pasek span.t { background: var(--ok); }
.pasek span.n { background: var(--bad); }

.zaliczone {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  background: var(--ok-soft); border-radius: var(--r); padding: 14px 16px;
}
.stempel {
  display: inline-block; transform: rotate(-5deg);
  border: 3px double var(--ok); color: var(--ok); border-radius: 6px; padding: 3px 12px;
  font-weight: 900; font-variation-settings: "CASL" 1, "MONO" 0; letter-spacing: 0.14em; text-transform: uppercase; font-size: 1.05rem;
}
.zaliczone p { margin: 0; flex: 1 1 160px; font-size: 0.9rem; }
@media (prefers-reduced-motion: no-preference) {
  .zaliczone.nowe .stempel { animation: przybij .45s cubic-bezier(.2,1.6,.4,1); }
  @keyframes przybij { from { transform: rotate(-12deg) scale(1.8); opacity: 0; } to { transform: rotate(-5deg) scale(1); opacity: 1; } }
}

.grupa { display: flex; flex-direction: column; gap: 10px; }
.grupa h3 {
  margin: 0; font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 750;
}
.karta {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
  display: flex; flex-direction: column; min-width: 0;
}
.karta.n { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad) inset; }
.karta header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 12px 0; }
.karta .opis { font-size: 0.86rem; font-weight: 650; min-width: 0; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; flex: none;
  font-size: 0.74rem; font-weight: 750; border-radius: 999px; padding: 2px 9px 2px 7px;
}
.chip.t { background: var(--ok-soft); color: var(--ok); }
.chip.n { background: var(--bad-soft); color: var(--bad); }
.chip.c { background: var(--sunk); color: var(--muted); padding-left: 9px; }
.karta pre {
  margin: 0; padding: 8px 12px 10px; overflow-x: auto; font-size: 0.84rem; line-height: 1.5; white-space: pre;
}
.powod { margin: 0; padding: 8px 12px 10px; border-top: 1px solid var(--line); font-size: 0.83rem; overflow-wrap: anywhere; }
.karta.t .powod { color: var(--muted); }
.karta.n .powod { color: var(--ink); background: var(--bad-soft); border-top-color: transparent; border-radius: 0 0 calc(var(--r) - 1px) calc(var(--r) - 1px); }
.powod + .powod { border-top: 0; padding-top: 0; }
.wsk { font-weight: 650; }
.t-key { color: var(--tk-key); }
.t-str { color: var(--tk-str); }
.t-num { color: var(--tk-num); }
.t-atom { color: var(--tk-atom); }

/* Piaskownica */
.piaskownica { display: flex; flex-direction: column; gap: 10px; flex: 1 1 auto; min-height: 0; }
.piaskownica .ramka { min-height: 260px; }
.werdykt-dok { display: flex; flex-direction: column; gap: 8px; }
.werdykt-glowny {
  display: flex; align-items: center; gap: 10px; border-radius: var(--r); padding: 12px 14px; font-weight: 750;
}
.werdykt-glowny.t { background: var(--ok-soft); color: var(--ok); }
.werdykt-glowny.n { background: var(--bad-soft); color: var(--bad); }
.werdykt-glowny.c { background: var(--panel); color: var(--muted); border: 1px solid var(--line); }
.bledy { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; font-size: 0.88rem; }

/* Edytor — motyw */
.cm-s-trener.CodeMirror { background: var(--panel); color: var(--ink); font-size: 0.92rem; line-height: 1.6; }
.cm-s-trener .CodeMirror-gutters { background: var(--sunk); border-right: 1px solid var(--line); }
.cm-s-trener .CodeMirror-linenumber { color: var(--muted); font-size: 0.8em; padding-right: 8px; }
.cm-s-trener .CodeMirror-cursor { border-left: 2px solid var(--accent); }
.cm-s-trener .CodeMirror-selected, .cm-s-trener.CodeMirror-focused .CodeMirror-selected { background: var(--accent-soft); }
.cm-s-trener .CodeMirror-line::selection, .cm-s-trener .CodeMirror-line > span::selection, .cm-s-trener .CodeMirror-line > span > span::selection { background: var(--accent-soft); }
.cm-s-trener .cm-string { color: var(--tk-str); }
.cm-s-trener .cm-string.cm-property { color: var(--tk-key); }

/* ================= Pomocnicze ================= */
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function md(s) { return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>'); }
function odmiana(n, f) {
  if (n === 1) return f[0];
  const d = n % 10, s = n % 100;
  return (d >= 2 && d <= 4 && !(s >= 12 && s <= 14)) ? f[1] : f[2];
}
function jeden(v) {
  if (v === null || typeof v !== 'object') return JSON.stringify(v);
  if (Array.isArray(v)) return '[' + v.map(jeden).join(', ') + ']';
  const e = Object.entries(v);
  return e.length ? '{ ' + e.map(([k, x]) => JSON.stringify(k) + ': ' + jeden(x)).join(', ') + ' }' : '{}';
}
function ladnie(v, wc = '') {
  if (v === null || typeof v !== 'object' || jeden(v).length + wc.length <= 52) return jeden(v);
  const nw = wc + '  ';
  if (Array.isArray(v)) return '[\n' + v.map(x => nw + ladnie(x, nw)).join(',\n') + '\n' + wc + ']';
  return '{\n' + Object.entries(v).map(([k, x]) => nw + JSON.stringify(k) + ': ' + ladnie(x, nw)).join(',\n') + '\n' + wc + '}';
}
function krotko(v) { const s = JSON.stringify(v); return s.length > 40 ? s.slice(0, 37) + '…' : s; }

  const ws = () => {

      const c = t[i];
      if (c === ' ' || c === '\t' || c === '\n' || c === '\r') i++;

      const c = t[i];

      if (c === '\\') {
        const d = t[i + 1];
        const mapa = { '"': '"', '\\': '\\', '/': '/', b: '\b', f: '\f', n: '\n', r: '\r', t: '\t' };

  /* ——— Zadanie ——— */
  function renderZadanie() {
    const z = $('#zadanie');
    if (stan.aktywne === 'piaskownica') {
      z.innerHTML = '<p class="eyebrow">Wolne pole</p><h1>Piaskownica</h1>' +
        '<p class="kontekst">Tu nie ma zadania. Po lewej masz schemat zamówienia ze sklepu, po prawej przykładowe zamówienie. Zmieniaj jedno albo drugie i obserwuj wynik. Przydaje się do pokazów na żywo i do sprawdzania pomysłów.</p>' +
        '<p class="polecenie"><strong>Spróbuj:</strong> ustaw ilość na 0, usuń e-mail klienta albo dopisz do zamówienia pole, którego schemat nie zna.</p>';
      $('#edytor-tytul').textContent = 'Schemat zamówienia';
      return;
    }
    const c = CW[stan.aktywne];
    z.innerHTML = '<p class="eyebrow">Ćwiczenie ' + c.nr + ' z ' + CWICZENIA.length + '</p><h1>' + esc(c.tytul) + '</h1>' +
      '<p class="kontekst">' + md(c.kontekst) + '</p>' +
      '<p class="polecenie"><strong>Zadanie:</strong> ' + md(c.zadanie) + '</p>' +
      '<div class="slowa">Nowe słowa kluczowe: ' + c.slowa.map(s => '<code>' + esc(s) + '</code>').join(' ') + '</div>' +
      '<div class="pomoc"><button class="btn" type="button" id="b-podp" aria-expanded="false" aria-controls="t-podp">Podpowiedź</button>' +
      '<button class="btn" type="button" id="b-roz" aria-expanded="false" aria-controls="t-roz">Rozwiązanie</button></div>' +
      '<div class="pomoc-tresc" id="t-podp" hidden><p>' + md(c.podpowiedz) + '</p></div>' +
      '<div class="pomoc-tresc" id="t-roz" hidden><pre>' + koloruj(ladnie(c.rozwiazanie)) + '</pre>' +
      '<div class="pomoc-akcje"><button class="btn btn-main" type="button" id="b-wstaw">Wstaw do edytora</button><small>Ctrl+Z (⌘Z) przywraca Twoją wersję.</small></div></div>';
    $('#edytor-tytul').textContent = 'Twój schemat';
    const przelacz = (b, t) => { const o = b.getAttribute('aria-expanded') !== 'true'; b.setAttribute('aria-expanded', o); t.hidden = !o; };
    $('#b-podp').onclick = () => przelacz($('#b-podp'), $('#t-podp'));
    $('#b-roz').onclick = () => przelacz($('#b-roz'), $('#t-roz'));
    $('#b-wstaw').onclick = () => { zastap(cm, ladnie(c.rozwiazanie)); cm.focus(); };
  }
  function zastap(ed, tekst) { ed.replaceRange(tekst, { line: 0, ch: 0 }, { line: ed.lastLine(), ch: ed.getLine(ed.lastLine()).length }); }

  function koloruj(json) {
    const re = /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g;
    let out = '', last = 0, m;
    while ((m = re.exec(json))) {
      out += esc(json.slice(last, m.index));
      if (m[1]) out += m[2] ? '<span class="t-key">' + esc(m[1]) + '</span>' + esc(m[2]) : '<span class="t-str">' + esc(m[1]) + '</span>';
      else out += '<span class="' + (m[3] ? 't-atom' : 't-num') + '">' + m[0] + '</span>';
      last = re.lastIndex;
    }
    return out + esc(json.slice(last));
  }

  /* ——— Znaczniki błędów w edytorze ——— */
  const znaczniki = new Map();
  function wyczysc(ed) {
    const z = znaczniki.get(ed) || [];
    z.forEach(f => f());
    znaczniki.set(ed, []);
  }
  function zaznacz(ed, pos, klasa) {
    if (pos == null) return null;
    const p = ed.posFromIndex(pos);
    const h = ed.addLineClass(p.line, 'background', klasa === 'blad' ? 'linia-bledu' : 'linia-uwagi');
    const lista = znaczniki.get(ed) || [];
    lista.push(() => ed.removeLineClass(h, 'background'));
    if (klasa === 'blad') {
      const tekst = ed.getLine(p.line);
      const od = p.ch < tekst.length ? p : { line: p.line, ch: Math.max(0, tekst.length - 1) };
      const mk = ed.markText(od, { line: od.line, ch: od.ch + 1 }, { className: 'znak-bledu' });
      lista.push(() => mk.clear());
    }
    znaczniki.set(ed, lista);
    return p.line + 1;
  }
  function wierszDiag(klasa, znak, etykieta, tekst, linia, ed) {
    const przycisk = linia ? '<button type="button" class="do-linii" data-linia="' + linia + '" data-ed="' + ed + '">linia ' + linia + '</button>' : '<span></span>';
    return '<div class="diag ' + klasa + '"><span class="znak" aria-hidden="true">' + znak + '</span><p>' +
      (etykieta ? '<span class="etykieta">' + etykieta + '.</span> ' : '') + esc(tekst) + '</p>' + przycisk + '</div>';
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('.do-linii'); if (!b) return;
    const ed = b.dataset.ed === 'dok' ? cmDok : cm; const l = +b.dataset.linia - 1;
    ed.focus(); ed.setCursor({ line: l, ch: ed.getLine(l).length }); ed.scrollIntoView(null, 80);
  });

  /* ——— Sprawdzanie ——— */
  let ostatnioZaliczone = null;
  function sprawdz() {
    wyczysc(cm);
    const w = sprawdzSchemat(cm.getValue());
    let html = '';
    if (w.blad) {
      const l = zaznacz(cm, w.blad.pos, 'blad');
      html += wierszDiag('blad', '!', w.blad.rodzaj, w.blad.tekst, l, 's');
    }
    for (const u of w.uwagi) {
      const l = u.poziom === 'ostrz' ? zaznacz(cm, u.pos, 'uwaga') : (u.pos != null ? cm.posFromIndex(u.pos).line + 1 : null);
      html += wierszDiag(u.poziom, u.poziom === 'info' ? 'i' : '?', u.poziom === 'info' ? 'Dobrze wiedzieć' : 'Uwaga', u.tekst, l, 's');
    }
    if (!w.blad && !w.uwagi.length) html = wierszDiag('dobrze', IKONA_T, '', 'Schemat jest poprawny.', null);
    $('#diagnoza').innerHTML = html;
    if (stan.aktywne === 'piaskownica') sprawdzDokument(w); else renderPrzyklady(CW[stan.aktywne], w);
  }

  function renderPrzyklady(c, w) {
    const wyniki = c.przyklady.map(pr => {
      if (!w.walidator) return { st: 'c' };
      const przeszedl = w.walidator(pr.dane);
      const bledy = przeszedl ? [] : komunikaty(w.walidator.errors || [], pr.dane, 3);
      return { st: przeszedl === pr.ok ? 't' : 'n', przeszedl, bledy };
    });
    const zgodne = wyniki.filter(x => x.st === 't').length, wszystkie = wyniki.length;
    const komplet = zgodne === wszystkie;
    let html = '<div class="podsum"><div class="podsum-wiersz"><h2>Przykłady</h2><span class="licznik">' +
      (w.walidator ? '<strong>' + zgodne + ' z ' + wszystkie + '</strong> zgadza się z oczekiwaniem' : 'Popraw schemat, żeby sprawdzić przykłady') +
      '</span></div><div class="pasek" aria-hidden="true">' + wyniki.map(x => '<span class="' + x.st + '"></span>').join('') + '</div></div>';
    if (komplet) {
      const nowe = ostatnioZaliczone !== c.id;
      const nast = CWICZENIA[c.nr] ? CWICZENIA[c.nr] : null;
      html += '<div class="zaliczone' + (nowe ? ' nowe' : '') + '"><span class="stempel">Zaliczone</span><p>Wszystkie przykłady zachowują się tak, jak trzeba.</p>' +
        '<button class="btn btn-main" type="button" data-id="' + (nast ? nast.id : 'piaskownica') + '" id="b-dalej">' + (nast ? 'Następne ćwiczenie →' : 'Do piaskownicy →') + '</button></div>';
      ostatnioZaliczone = c.id;
      if (!stan.zaliczone[c.id]) { stan.zaliczone[c.id] = true; zapisz(); renderLista(); }
    } else if (ostatnioZaliczone === c.id) ostatnioZaliczone = null;

    const karta = (pr, r) => {
      let chip, powod = '';
      if (r.st === 'c') chip = '<span class="chip c">czeka</span>';
      else {
        chip = '<span class="chip ' + r.st + '">' + (r.st === 't' ? IKONA_T : IKONA_N) + (r.przeszedl ? 'Przechodzi' : 'Odrzucony') + '</span>';
        if (pr.ok && !r.przeszedl) powod = '<p class="powod">Ten dokument powinien przejść, ale schemat zgłasza: ' + r.bledy.map(esc).join(' ') + '</p>';
        else if (!pr.ok && r.przeszedl) powod = '<p class="powod">Ten dokument powinien zostać odrzucony, ale schemat go przepuszcza.</p>' +
          (pr.wsk ? '<p class="powod"><span class="wsk">Wskazówka:</span> ' + md(pr.wsk) + '</p>' : '');
        else if (!pr.ok) powod = '<p class="powod">Powód: ' + esc(r.bledy[0] || '') + '</p>';
      }
      return '<article class="karta ' + r.st + '"><header><span class="opis">' + esc(pr.opis) + '</span>' + chip + '</header><pre>' + koloruj(ladnie(pr.dane)) + '</pre>' + powod + '</article>';
    };
    const grupa = (tytul, ok) => '<section class="grupa"><h3>' + tytul + '</h3>' +
      c.przyklady.map((pr, i) => pr.ok === ok ? karta(pr, wyniki[i]) : '').join('') + '</section>';
    html += grupa('Muszą przejść', true) + grupa('Muszą zostać odrzucone', false);
    $('#panel-przyklady').innerHTML = html;
    const d = $('#b-dalej'); if (d) d.onclick = () => wybierz(d.dataset.id);
  }

  function sprawdzDokument(w) {
    wyczysc(cmDok);
    const out = $('#werdykt-dok');
    let dok;
    try { dok = parsujJSON(cmDok.getValue(), 'Dokument jest pusty.').value; }
    catch (e) {
      const l = zaznacz(cmDok, e.pos, 'blad');
      out.innerHTML = wierszDiag('blad', '!', 'Błąd składni JSON w dokumencie', e.message, l, 'dok');
      return;
    }
    if (!w.walidator) { out.innerHTML = '<div class="werdykt-glowny c">Popraw schemat, żeby sprawdzić dokument.</div>'; return; }
    if (w.walidator(dok)) { out.innerHTML = '<div class="werdykt-glowny t">' + IKONA_T + 'Dokument jest zgodny ze schematem.</div>'; return; }
    const lista = komunikaty(w.walidator.errors || [], dok);
    out.innerHTML = '<div class="werdykt-glowny n">' + IKONA_N + 'Dokument nie jest zgodny ze schematem · ' + lista.length + ' ' + odmiana(lista.length, ['problem', 'problemy', 'problemów']) + '</div>' +
      '<ol class="bledy">' + lista.map(t => '<li>' + esc(t) + '</li>').join('') + '</ol>';
  }

  let timer;
  const pozniej = () => { clearTimeout(timer); timer = setTimeout(sprawdz, 180); };
  cm.on('change', () => { stan.schematy[stan.aktywne] = cm.getValue(); zapisz(); pozniej(); });
  cmDok.on('change', () => { stan.dokument = cmDok.getValue(); zapisz(); pozniej(); });

  function wybierz(id) {
    stan.aktywne = id; zapisz();
    renderLista(); renderZadanie();
    cm.swapDoc(docDla(id));
    const p = id === 'piaskownica';
    $('#panel-przyklady').hidden = p; $('#panel-piaskownica').hidden = !p;
    if (p) cmDok.refresh();
    $('.srodek').scrollTop = 0; $('.prawa').scrollTop = 0;
    sprawdz();
  }

  $('#od-nowa').onclick = () => { zastap(cm, startowy(stan.aktywne)); cm.focus(); };
  $('#dok-przyklad').onclick = () => { zastap(cmDok, ladnie(PIASKOWNICA.dokument)); cmDok.focus(); };

  const ustawDuze = () => {
    document.documentElement.classList.toggle('duze', !!stan.duze);
    $('#duzy').setAttribute('aria-pressed', !!stan.duze);
    $('#duzy .stan').textContent = stan.duze ? 'wł.' : 'wył.';
    cm.refresh(); cmDok.refresh();
  };
  $('#duzy').onclick = () => { stan.duze = !stan.duze; zapisz(); ustawDuze(); };

  let potwierdz = null;
  $('#wyczysc').onclick = () => {
    const b = $('#wyczysc');
    if (!potwierdz) {
      b.textContent = 'Na pewno? Kliknij jeszcze raz'; b.classList.add('uwaga');
      potwierdz = setTimeout(() => { potwierdz = null; b.textContent = 'Wyczyść cały postęp'; b.classList.remove('uwaga'); }, 4000);
      return;
    }
    clearTimeout(potwierdz); potwierdz = null;
    b.textContent = 'Wyczyść cały postęp'; b.classList.remove('uwaga');
    stan.schematy = {}; stan.zaliczone = {}; stan.dokument = null;
    for (const k of Object.keys(docs)) delete docs[k];
    cmDok.setValue(ladnie(PIASKOWNICA.dokument));
    ostatnioZaliczone = null;
    zapisz();
    wybierz('typ');
  };

  ustawDuze();
  wybierz(stan.aktywne);
})();
</script>
