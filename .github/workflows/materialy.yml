name: Materiały

on:
  workflow_dispatch: {}

jobs:
  materialy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run tresc
      - run: npm run materialy
      - uses: actions/upload-artifact@v4
        with:
          name: materialy
          path: materialy/wynik/
